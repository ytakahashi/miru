nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.17.0.cjs
npmPreapprovedPackages:
  - vitest
  - '@vitest/*'
# Vite+ toolchain versions. Keep these in sync with `resolutions` in package.json
# - `vite` and `vite-plus` must share the same version.
# - `vitest` must match the version that the installed `vite-plus` package depends on
#   ("vitest" under "Tools" in `yarn vp --version`).
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
